<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- YouTube's player, full-window, for a lens's web view on Spectacles. YouTube's embed refuses to play when opened
     on its own (Error 153: it needs to know which page it's in), so the lens opens this page: /yt/?v=VIDEO_ID -->
<script>
  const m = (new URLSearchParams(location.search).get("v") || "").match(/^[A-Za-z0-9_-]{11}$/)
  if (m) {
    const f = document.createElement("iframe")
    f.src = "https://www.youtube-nocookie.com/embed/" + m[0] + "?autoplay=1&playsinline=1&rel=0&modestbranding=1&fs=0"
    f.allow = "autoplay; encrypted-media; picture-in-picture"
    f.referrerPolicy = "strict-origin-when-cross-origin"
    document.body.appendChild(f)
  }
</script>
</body>
</html>
